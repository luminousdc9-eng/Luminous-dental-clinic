<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luminous Dental Clinic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #1d1d1d;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 45px 22px 30px;
      text-align: center;
    }

    .logo {
      width: 125px;
      height: 125px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 500;
      letter-spacing: 5px;
    }

    .subtitle {
      margin-top: 8px;
      margin-bottom: 32px;
      color: #b39459;
      font-size: 12px;
      letter-spacing: 4px;
    }

    .button {
      display: block;
      position: relative;
      text-decoration: none;
      color: #222;
      background: #fff;
      border: 1px solid #d5bf96;
      border-radius: 14px;
      padding: 17px 20px;
      margin: 13px 0;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .icon {
      position: absolute;
      left: 18px;
      font-size: 19px;
    }

    .location {
      font-size: 14px;
    }

    .footer {
      margin-top: 32px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #a08d6b;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Logo -->
    <img
      class="logo"
      src="https://i.imgur.com/8QYwQ0A.png"
      alt="Luminous Dental Clinic"
    >

    <h1>LUMINOUS</h1>

    <div class="subtitle">
      DENTAL CLINIC
    </div>

    <!-- WhatsApp -->
    <a
      class="button"
      href="https://wa.me/201042636055"
      target="_blank"
    >
      <span class="icon">💬</span>
      WhatsApp
    </a>

    <!-- Location -->
    <a
      class="button location"
      href="https://maps.app.goo.gl/W3TLU6qzMvDY3WJG7"
      target="_blank"
    >
      <span class="icon">📍</span>
      Ozone Medical Center — Clinic C108
    </a>

    <!-- Instagram -->
    <a
      class="button"
      href="https://instagram.com/luminous_dental.clinic"
      target="_blank"
    >
      <span class="icon">◎</span>
      Instagram
    </a>

    <!-- TikTok -->
    <a
      class="button"
      href="https://tiktok.com/@luminous.dental.clinic"
      target="_blank"
    >
      <span class="icon">♪</span>
      TikTok
    </a>

    <div class="footer">
      YOUR SMILE, OUR PRIORITY
    </div>

  </div>

</body>
</html>
